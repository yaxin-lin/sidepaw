[workspace]
resolver = "2"
members = ["crates/sidepaw-core", "crates/sidepaw-daemon", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/yaxin-lin/sidepaw"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
