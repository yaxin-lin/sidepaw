name: Feature request
description: Something sidepaw should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current behaviour gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Optional. How you would like it to work.
  - type: checkboxes
    id: checked
    attributes:
      label: Before filing
      options:
        - label: I checked docs/roadmap.md and this is not already planned there
          required: true
