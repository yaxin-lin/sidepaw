<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidepaw</title>
    <style>
      /* Same tokens as setup.html; the bar color is the reference palette's
         blue, validated against both card surfaces. */
      :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #f5f5f7; --card: #fff; --muted: #6e6e73; --line: #d2d2d7; --grid: #ececef; --bar: #2a78d6; --bar-soft: #cde2fb; --accent: #2962ff; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --card: #2c2c2e; --muted: #98989d; --line: #3a3a3c; --grid: #38383b; --bar: #3987e5; --bar-soft: #184f95; } }
      html, body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
      main { padding: 18px 22px 26px; max-width: 900px; }
      header { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
      h1 { font-size: 18px; margin: 0; flex: 1; }
      h2 { font-size: 14px; margin: 0 0 10px; }
      .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
      .seg button { font: inherit; font-size: 13px; padding: 4px 12px; border: 0; background: var(--card); color: var(--fg); cursor: pointer; }
      .seg button + button { border-left: 1px solid var(--line); }
      .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
      section { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 14px; }
      .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
      .tile { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
      .tile .v { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .tile .k { font-size: 12px; color: var(--muted); }
      .chart { position: relative; }
      svg { display: block; width: 100%; height: 220px; overflow: visible; }
      svg text { font: 11px system-ui, -apple-system, sans-serif; fill: var(--muted); font-variant-numeric: tabular-nums; }
      .grid line { stroke: var(--grid); stroke-width: 1; }
      .base { stroke: var(--line); stroke-width: 1; }
      .bar { fill: var(--bar); }
      .col:hover .bar, .col.on .bar { fill: var(--bar); opacity: .8; }
      .hit { fill: transparent; cursor: default; }
      .col.on .hit { fill: var(--grid); opacity: .5; }
      .tip { position: absolute; pointer-events: none; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.12); white-space: nowrap; }
      .tip[hidden] { display: none; }
      .tip b { display: block; margin-bottom: 2px; }
      .tip span { color: var(--muted); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
      th { color: var(--muted); font-weight: 500; font-size: 12px; white-space: nowrap; }
      td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
      td.meter { width: 22%; }
      .meter div { height: 6px; border-radius: 3px; background: var(--bar-soft); }
      .meter div i { display: block; height: 100%; border-radius: 3px; background: var(--bar); }
      .muted { color: var(--muted); }
      .empty { color: var(--muted); padding: 30px 0; text-align: center; }
      details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 8px; }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1 data-i18n="history.title">Usage history</h1>
        <div class="seg" id="range" role="group"></div>
      </header>
      <div class="tiles" id="tiles"></div>
      <section style="margin-top:14px">
        <h2 data-i18n="history.per_day">Tool calls per day</h2>
        <div class="chart" id="chart"></div>
        <details>
          <summary data-i18n="history.as_table">Show as a table</summary>
          <table id="day-table"></table>
        </details>
      </section>
      <section>
        <h2 data-i18n="history.by_project">By project</h2>
        <table id="projects"></table>
        <p class="msg muted" id="projects-note"></p>
      </section>
    </main>
    <script type="module" src="/src/history/main.ts"></script>
  </body>
</html>
