<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidepaw</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
      body { width: 192px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
      #bubble {
        position: absolute; bottom: 240px; left: 10px; right: 10px;
        font: 13px/1.35 -apple-system, system-ui, sans-serif; color: #1d1d1f;
        background: rgba(255,255,255,.96); border-radius: 14px; padding: 8px 12px;
        box-shadow: 0 4px 14px rgba(0,0,0,.14), 0 0 0 .5px rgba(0,0,0,.08);
        text-align: center; word-break: break-word; white-space: pre-line;
        opacity: 0; transform: translateY(6px) scale(.96);
        transition: opacity .16s ease, transform .16s ease;
        pointer-events: none;
      }
      #bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -5px; width: 10px; height: 10px;
        margin-left: -5px; background: inherit; transform: rotate(45deg);
        box-shadow: 2px 2px 3px rgba(0,0,0,.06);
      }
      #bubble.show { opacity: 1; transform: none; }
      #bubble.ask { pointer-events: auto; text-align: left; }
      #bubble.nudge { pointer-events: auto; cursor: pointer; padding-right: 22px; }
      #bubble.nudge .x { position: absolute; top: 3px; right: 5px; border: 0; background: none; color: inherit; opacity: .45; font: 14px/1 system-ui, sans-serif; cursor: pointer; padding: 2px; }
      #bubble.nudge .x:hover { opacity: .9; }
      #bubble.ask .q { font-size: 11px; color: #6e6e73; margin-bottom: 2px; }
      #bubble.ask code { display: block; font: 11.5px ui-monospace, Menlo, monospace; white-space: pre-wrap; word-break: break-all; max-height: 48px; overflow: hidden; }
      #bubble.ask .q { display: flex; justify-content: space-between; gap: 6px; }
      #bubble.ask .more { white-space: nowrap; }
      #bubble.ask .clock { height: 2px; margin-top: 6px; border-radius: 1px; background: rgba(127,127,127,.2); overflow: hidden; }
      #bubble.ask .clock i { display: block; height: 100%; width: 100%; background: #b26a00; transition-property: width; transition-timing-function: linear; }
      #bubble.ask kbd { font: 500 10px ui-monospace, Menlo, monospace; opacity: .8; margin-left: 5px; }
      #bubble.ask .btns { display: flex; gap: 6px; margin-top: 7px; }
      #bubble.ask button { flex: 1; font: 600 12px system-ui, sans-serif; padding: 5px 0; border-radius: 8px; border: 0; cursor: pointer; color: #fff; }
      #bubble.ask button.allow { background: #2e7d32; }
      #bubble.ask button.deny { background: #c62828; }
      @media (prefers-color-scheme: dark) { #bubble.ask .q { color: #98989d; } }
      #bubble[hidden] { display: none; }
      @media (prefers-color-scheme: dark) {
        #bubble { color: #f5f5f7; background: rgba(44,44,46,.96); box-shadow: 0 4px 14px rgba(0,0,0,.4), 0 0 0 .5px rgba(255,255,255,.12); }
      }
      canvas { width: 192px; height: 208px; cursor: grab; }
      #label {
        font: 11px/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55);
        padding: 3px 7px; border-radius: 8px; margin-top: 4px; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="bubble" hidden></div>
    <canvas id="pet" width="192" height="208"></canvas>
    <div id="label">…</div>
    <script type="module" src="/src/pet/main.ts"></script>
  </body>
</html>
