<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidepaw</title>
    <style>
      html, body { margin: 0; background: transparent; overflow: hidden; user-select: none; }
      body { width: 192px; height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; }
      #bubble {
        position: absolute; top: 6px; left: 8px; right: 8px;
        font: 12px/1.35 system-ui, sans-serif; color: #1d1d1f; background: #fff;
        border: 1px solid rgba(0,0,0,.15); border-radius: 12px; padding: 7px 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,.15); text-align: center; word-break: break-word;
      }
      #bubble::after {
        content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -6px;
        border: 6px solid transparent; border-top-color: #fff; border-bottom: 0;
      }
      #bubble[hidden] { display: none; }
      canvas { width: 192px; height: 208px; cursor: grab; }
      #label {
        font: 11px/1 system-ui, sans-serif; color: #fff; background: rgba(0,0,0,.55);
        padding: 3px 7px; border-radius: 8px; margin-top: 4px; white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div id="bubble" hidden></div>
    <canvas id="pet" width="192" height="208"></canvas>
    <div id="label">starting</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
