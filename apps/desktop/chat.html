<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>sidepaw</title>
    <style>
      :root { color-scheme: light dark; --fg: #1d1d1f; --bg: #f5f5f7; --card: #fff; --muted: #6e6e73; --line: #d2d2d7; --bad: #c62828; --accent: #2962ff; --pet: #e8f0fe; }
      @media (prefers-color-scheme: dark) { :root { --fg: #f5f5f7; --bg: #1c1c1e; --card: #2c2c2e; --muted: #98989d; --line: #3a3a3c; --pet: #2a3550; } }
      html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, sans-serif; }
      body { display: flex; flex-direction: column; }
      #log { flex: 1; overflow-y: auto; padding: 14px 14px 6px; display: flex; flex-direction: column; gap: 8px; }
      .turn { max-width: 86%; padding: 8px 12px; border-radius: 14px; white-space: pre-wrap; word-break: break-word; }
      .turn.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
      .turn.pet { align-self: flex-start; background: var(--pet); border-bottom-left-radius: 4px; }
      .turn.err { align-self: flex-start; color: var(--bad); font-size: 13px; }
      #notice { margin: 14px; padding: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
      #notice[hidden] { display: none; }
      #status { padding: 4px 14px 6px; font-size: 12px; color: var(--muted); }
      #status summary { cursor: pointer; }
      #status pre { font-size: 11px; max-height: 160px; overflow: auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin: 6px 0 0; white-space: pre-wrap; }
      form { display: flex; gap: 8px; padding: 8px 14px 14px; border-top: 1px solid var(--line); background: var(--card); }
      textarea { flex: 1; font: inherit; resize: none; padding: 7px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); min-height: 38px; max-height: 120px; }
      button { font: inherit; padding: 6px 14px; border-radius: 10px; border: 0; background: var(--accent); color: #fff; cursor: pointer; }
      button:disabled { opacity: .5; cursor: default; }
      #notice button { margin-top: 8px; }
    </style>
  </head>
  <body>
    <div id="log"></div>
    <div id="notice" hidden>
      <div id="notice-text"></div>
      <button id="notice-setup" data-i18n="chat.open_setup">Open setup</button>
    </div>
    <div id="status">
      <details>
        <summary id="status-line"></summary>
        <pre id="status-text"></pre>
      </details>
    </div>
    <form id="form">
      <textarea id="input" rows="1"></textarea>
      <button type="submit" id="send" data-i18n="chat.send">Send</button>
    </form>
    <script type="module" src="/src/chat/main.ts"></script>
  </body>
</html>
