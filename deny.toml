# cargo-deny configuration. Run `cargo deny check`; CI runs it on every PR.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = [
    # proc-macro-error 1.x is unmaintained. It reaches us only through
    # Tauri's Linux GTK bindings (gtk -> glib-macros); nothing to switch
    # to until upstream moves. Revisit when bumping tauri.
    { id = "RUSTSEC-2024-0370", reason = "transitive via tauri/gtk on Linux" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",   # webpki-roots: Mozilla CA bundle, pulled in by ureq's TLS
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates reference each other by path without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
