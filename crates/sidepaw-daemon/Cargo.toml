[package]
name = "sidepaw-daemon"
description = "Local ingest server, store and host adapters for sidepaw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "sidepaw_daemon"
path = "src/lib.rs"

[[bin]]
name = "sidepaw"
path = "src/main.rs"

[dependencies]
sidepaw-core = { path = "../sidepaw-core", version = "0.1.0" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
toml = "1"
toml_edit = "0.25"
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["json"] }
uuid = { version = "1", features = ["v4"] }
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

# The API key lives in the OS credential store, never in config.toml.
# Linux goes through the Secret Service over zbus (pure Rust, already in
# the tree via notify-rust); keyutils alone would not survive a reboot.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "tokio", "crypto-rust"] }

[features]
ts = ["dep:ts-rs", "sidepaw-core/ts"]

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints.clippy]
all = "warn"
