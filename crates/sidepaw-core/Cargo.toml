[package]
name = "sidepaw-core"
description = "Event model, state machine and pet pack format for sidepaw"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }

[features]
# TypeScript bindings for the desktop app; generated by `pnpm gen:types`.
ts = ["dep:ts-rs"]

[lints.clippy]
all = "warn"
